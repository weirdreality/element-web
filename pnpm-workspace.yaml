linkWorkspacePackages: true
cleanupUnusedCatalogs: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeStrict: true
dedupePeerDependents: true
dedupePeers: true

packages:
    - "apps/*"
    - "packages/*"
    - "modules"
    - "modules/*"

catalog:
    # typescript
    "typescript": 7.0.2
    "@typescript/native": npm:typescript@7.0.2
    "@types/node": ts7.0
    # react
    react: ^19.0.0
    react-dom: ^19.0.0
    "@types/react": ^19.2.10
    "@types/react-dom": ^19.2.3
    # playwright
    "@playwright/test": 1.65.0
    "playwright-core": 1.65.0
    serve: 14.2.8
    # Compound
    "@vector-im/compound-design-tokens": 11.3.0
    "@vector-im/compound-web": "10.4.0"
    # i18n
    matrix-web-i18n: 3.6.0
    # emojibase
    "@matrix-org/emojibase-bindings": 1.5.0
    # fonts
    "@fontsource/inter": 5.3.0
    # vite
    vite: 8.3.6
    vite-plugin-node-polyfills: 0.28.0
    vite-plugin-svgr: 5.2.0
    vitest: 5.1.0
    "@vitest/coverage-v8": 5.1.0
    "@vitest/browser-playwright": 5.1.0
    "@vitest/browser": 5.1.0
    "@vitest/spy": 5.1.0
    "@vitest/ui": 5.1.0
    "@vitejs/plugin-react": 6.3.0
    unplugin-dts: 1.1.2
    # nx
    nx: 24.0.6
    # oxc
    oxlint: 1.90.0

catalogs:
    ts6:
        typescript: npm:@typescript/typescript6@6.0.2
        "@types/node": ts6.0

packageExtensions:
    fdir:
        dependencies:
            # Fix missing type dependency
            "@types/picomatch": 4.0.2
